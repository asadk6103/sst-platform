# SST Platform — Docker Compose (production-style stack)
#
#   docker compose up -d --build        start everything — no .env file is required
#   open http://localhost:8000/admin/   first visit shows the setup wizard
#   docker compose logs api             shows the one-time setup code
#
# Everything else (administrator account, public address, upload limit, cookies, security
# keys) is configured in the administration portal. Security keys are generated on first
# start and kept in the private "config" volume.
#
# Optional overrides (only if you need them) can go in a .env file next to this one:
#   HTTP_PORT          port on this machine (default 8000)
#   POSTGRES_PASSWORD  database password — only read when the database volume is first created;
#                      the database is reachable only inside this stack
#
# Development with hot reload: see docker-compose.dev.yml

name: sst

x-db-url: &db-url postgresql://${POSTGRES_USER:-sst}:${POSTGRES_PASSWORD:-sst_internal_db}@postgres:5432/${POSTGRES_DB:-sst}?schema=public

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sst}
      POSTGRES_USER: ${POSTGRES_USER:-sst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sst_internal_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: runtime
    image: sst/api:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4200"
      DATABASE_URL: *db-url
      CONFIG_DIR: ./config
      UPLOAD_DIR: ./uploads
      REVALIDATE_URL: http://web:3000/cms-hooks/revalidate
      TRUST_PROXY: "1"
      SEED_ON_START: "true"
    volumes:
      - config:/app/backend/config
      - uploads:/app/backend/uploads
      - private_uploads:/app/backend/private-uploads
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: infrastructure/docker/nginx.Dockerfile
    image: sst/nginx:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8000}:80"
    volumes:
      - uploads:/srv/uploads:ro
    # No depends_on: upstreams are resolved per request, so the proxy starts independently
    # and shows a holding page while the API / website / admin are starting.

  admin:
    build:
      context: .
      dockerfile: infrastructure/docker/admin.Dockerfile
      target: runtime
    image: sst/admin:latest
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      target: runtime
    image: sst/web:latest
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4200
      CONFIG_DIR: /app/config
    volumes:
      # read-only: the website only needs the shared refresh key generated by the API
      - config:/app/config:ro

volumes:
  pgdata:          # PostgreSQL data (persistent)
  config:          # generated security keys and the first-run setup code (private)
  private_uploads: # CVs and other private attachments (never served publicly)
  uploads:         # uploaded media — originals and responsive variants (persistent)

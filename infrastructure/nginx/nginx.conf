# SST Platform reverse proxy — single public entry point
#   /            → public website   (service: web,   port 3000)
#   /admin/      → admin portal     (service: admin, port 80)
#   /api/        → REST API         (service: api,   port 4200)
#   /uploads/    → uploaded media   (served directly from the shared volume)
#
# Upstreams are resolved at request time through Docker's DNS so the proxy starts even when a
# service is not running; unavailable services show a friendly holding page (502/503/504).

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  keepalive_timeout 65;
  client_max_body_size 101m;  # API enforces the limit set in Administration → System (max 100 MB)

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/xml;

  log_format main '$remote_addr "$request" $status $body_bytes_sent ${request_time}s "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  # Behind the optional HTTPS container (docker-compose.https.yml) keep the original scheme.
  map $http_x_forwarded_proto $forwarded_proto { default $http_x_forwarded_proto; '' $scheme; }

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS is added by the HTTPS container (docker-compose.https.yml) when it is enabled.

    set $api_upstream   api:4200;
    set $web_upstream   web:3000;
    set $admin_upstream admin:80;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    error_page 502 503 504 /__unavailable.html;
    location = /__unavailable.html {
      root /usr/share/nginx/html;
      internal;
    }

    location /api/ {
      proxy_pass http://$api_upstream;
      proxy_read_timeout 120s;
    }

    location /uploads/ {
      alias /srv/uploads/;
      expires 30d;
      add_header Cache-Control "public" always;
      add_header X-Content-Type-Options nosniff always;
      try_files $uri =404;
    }

    location = /admin { return 301 /admin/; }
    location /admin/ {
      proxy_pass http://$admin_upstream;
    }

    location / {
      proxy_pass http://$web_upstream;
    }
  }
}
